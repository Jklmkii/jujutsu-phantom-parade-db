<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>JJKPPDB</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
    }
    body {
      background-color: #0a0614;
      color: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      overflow: hidden;
      border: 1px solid #3b1d6e;
      border-radius: 12px;
      -webkit-app-region: drag;
    }
    .aura-container {
      position: relative;
      width: 90px;
      height: 90px;
      margin-bottom: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .pulse-ring {
      position: absolute;
      width: 100%;
      height: 100%;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(168, 85, 247, 0.4) 0%, rgba(219, 39, 119, 0.1) 70%, transparent 100%);
      animation: pulse 1.8s infinite ease-out;
    }
    .pulse-ring-2 {
      position: absolute;
      width: 100%;
      height: 100%;
      border-radius: 50%;
      border: 2px solid rgba(192, 132, 252, 0.6);
      animation: pulse-border 1.8s infinite ease-out 0.4s;
    }
    .core-logo {
      position: relative;
      width: 76px;
      height: 76px;
      object-fit: contain;
      filter: drop-shadow(0 0 16px #a855f7) drop-shadow(0 0 24px rgba(168, 85, 247, 0.5));
      animation: pulse-logo 2.5s ease-in-out infinite;
    }
    .title {
      font-size: 16px;
      font-weight: 900;
      letter-spacing: 2px;
      background: linear-gradient(135deg, #c084fc 0%, #f472b6 50%, #60a5fa 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 6px;
      text-transform: uppercase;
    }
    .subtitle {
      font-size: 11px;
      font-weight: 600;
      color: #94a3b8;
      letter-spacing: 1px;
      margin-bottom: 24px;
    }
    .progress-bar-bg {
      width: 260px;
      height: 4px;
      background: rgba(255, 255, 255, 0.08);
      border-radius: 4px;
      overflow: hidden;
      position: relative;
    }
    .progress-bar-fill {
      position: absolute;
      top: 0;
      left: 0;
      height: 100%;
      width: 40%;
      background: linear-gradient(90deg, #9333ea, #ec4899, #38bdf8);
      border-radius: 4px;
      box-shadow: 0 0 10px #ec4899;
      animation: progress-move 1.5s infinite ease-in-out;
    }
    .status-text {
      font-size: 10px;
      color: #64748b;
      margin-top: 10px;
      letter-spacing: 0.5px;
    }

    @keyframes pulse {
      0% { transform: scale(0.85); opacity: 0.8; }
      50% { transform: scale(1.25); opacity: 0.3; }
      100% { transform: scale(0.85); opacity: 0.8; }
    }
    @keyframes pulse-border {
      0% { transform: scale(0.8); opacity: 1; }
      100% { transform: scale(1.4); opacity: 0; }
    }
    @keyframes pulse-logo {
      0%, 100% { transform: scale(1); filter: drop-shadow(0 0 14px #a855f7); }
      50% { transform: scale(1.08); filter: drop-shadow(0 0 24px #c084fc); }
    }
    @keyframes progress-move {
      0% { left: -40%; width: 40%; }
      50% { left: 30%; width: 55%; }
      100% { left: 100%; width: 30%; }
    }
  </style>
</head>
<body>
  <div class="aura-container">
    <div class="pulse-ring"></div>
    <div class="pulse-ring-2"></div>
    <img class="core-logo" src="../public/assets/logo.png" alt="Logo" />
  </div>
  <h1 class="title">Phantom Parade DB</h1>
  <p class="subtitle">JUJUTSU KAISEN (OFFLINE)</p>
  
  <div class="progress-bar-bg">
    <div class="progress-bar-fill"></div>
  </div>
  
  <span class="status-text">Inicializando energia amaldiçoada...</span>
</body>
</html>
