name: Daily Content Auto-Sync

on:
  schedule:
    # Executa todos os dias às 03:00 UTC (00:00 Horário de Brasília)
    - cron: '0 3 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    name: Sync Wiki Content
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm install --no-save

      - name: Run wiki content sync
        id: sync_step
        run: node scripts/sync_new_content.cjs

      - name: Check for data changes
        id: git_status
        shell: bash
        run: |
          if [[ -n $(git status --porcelain src/data/ public/assets/) ]]; then
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
            echo "Alterações detectadas em src/data/ ou public/assets/."
          else
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
            echo "Nenhuma alteração de conteúdo na wiki."
          fi

      - name: Commit and push changes to trigger new release
        if: steps.git_status.outputs.has_changes == 'true'
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add src/data/ public/assets/
          if git diff --staged --quiet; then
            echo "Nenhuma alteração em stage para commitar. Encerrando com sucesso."
            exit 0
          fi
          git commit -m "feat(sync): sincronizados novos personagens e memorias da wiki [auto-sync]"
          git pull --rebase origin main || true
          git push origin main
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
