name: Build and Publish Release

on:
  push:
    branches:
      - main
    paths-ignore:
      - '**.md'
      - '.Jules/**'
      - '.jules/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release-windows:
    name: Build & Publish Windows Release
    runs-on: windows-latest
    outputs:
      tag: ${{ steps.check_release.outputs.tag }}
      version: ${{ steps.check_release.outputs.version }}
      should_release: ${{ steps.check_release.outputs.should_release }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Run static linter
        run: npm run lint

      - name: Verify build bundle
        run: npm run build

      - name: Check and auto-bump version
        id: check_release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/check-and-bump-version.cjs

      - name: Commit and push bumped version
        if: steps.check_release.outputs.bumped == 'true'
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add package.json
          git commit -m "chore(release): bump version to ${{ steps.check_release.outputs.version }} [skip ci]" || exit 0
          git push origin main || echo "Push skipped or protected"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Electron application (NSIS + latest.yml)
        if: steps.check_release.outputs.should_release != 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx electron-builder --win --x64 --publish never

      - name: Publish release to GitHub
        if: steps.check_release.outputs.should_release != 'false'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/publish-release.cjs
